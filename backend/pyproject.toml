[project]
name = "gov-knowledge-assistant-backend"
version = "0.2.0"
requires-python = ">=3.12"
# Keep in sync with requirements.txt.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.50",
    "httpx>=0.27",
    "pypdf>=5.0",
    "fonttools>=4.50",
    "PyJWT>=2.9",
    "chromadb>=1.0",
    "reportlab>=4.2",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
